group = 'org.fidonet.binkp'
description = 'BinkP Common'
dependencies {
  implementation project(':event-bus')
    implementation 'org.slf4j:slf4j-api:1.7.21'
  implementation project(':fido-fts')
  implementation project(':tools')
    testImplementation 'junit:junit:4.12'
  compileOnly project(':plugin-manager')
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'
}

task packageTests(type: Jar) {
  from sourceSets.test.output
  archiveClassifier = 'tests'
}

configurations {
  testArtifacts
}

artifacts {
  testArtifacts packageTests
}
