group = 'org.fidonet.protocol'
description = 'BinkP Mina2'
dependencies {
  implementation project(':fido-config')
    implementation 'org.apache.mina:mina-core:2.0.13'
  implementation project(':tools')
  implementation project(':event-bus')
    implementation 'org.slf4j:slf4j-api:1.7.21'
  implementation project(':binkp-root:binkp-common')
    testImplementation 'junit:junit:4.12'
  testImplementation project(path: ':binkp-root:binkp-common', configuration: 'testArtifacts')
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.6.2'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.6.2'
  compileOnly project(':plugin-manager')
}
