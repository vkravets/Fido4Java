group = 'org.fidonet.protocol'
description = 'BinkP Mina2'
dependencies {
  implementation project(':fido-config')
    implementation 'org.apache.mina:mina-core:2.2.9'
  implementation project(':tools')
  implementation project(':event-bus')
    implementation 'org.slf4j:slf4j-api:2.0.20'
  implementation project(':binkp-root:binkp-common')

  testImplementation project(path: ':binkp-root:binkp-common', configuration: 'testArtifacts')
    compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.26.1'
  compileOnly project(':plugin-manager')
}

apply from: "$rootDir/gradle/binkd-integration.gradle"
