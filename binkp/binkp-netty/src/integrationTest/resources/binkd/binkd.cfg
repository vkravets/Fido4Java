sysname "JFtn Docker interoperability test"
sysop "Test"
location "Docker"
nodeinfo "TCP,BINKP"
domain fidonet.org /data/outbound 1
domain fidonet alias-for fidonet.org
address 1:500/102@fidonet.org
iport 24554
conlog 5
log /data/binkd.log
loglevel 5
timeout 30
maxservers 2
inbound /data/inbound
inbound-nonsecure /data/nonsecure
temp-inbound /data/partial
prescan
send-if-pwd
# BinkdTestPeer substitutes the endpoint for the selected role.
# Files in outbox are deleted on ACK; server-only mode prevents outbound calls.
node 1:500/101@fidonet.org -nomd -nohc @PEER_ENDPOINT@ docker-secret i /data/outbox /data/inbound
