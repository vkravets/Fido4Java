group = 'org.fidonet.binkp'
description = 'binkp-netty'

dependencies {
    implementation project(':fido-config')
    implementation project(':fido-fts')
    implementation project(':tools')
    implementation project(':event-bus')
    implementation project(':binkp-root:binkp-common')
    compileOnly project(':plugin-manager')

    implementation platform('io.netty:netty-bom:4.2.19.Final')
    implementation 'io.netty:netty-transport'
    implementation 'io.netty:netty-handler'
    implementation 'io.netty:netty-common'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.26.1'

    testImplementation project(path: ':binkp-root:binkp-common', configuration: 'testArtifacts')

    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.26.1'
}

apply from: "$rootDir/gradle/binkd-integration.gradle"

tasks.named('binkdDockerTest') {
    systemProperty 'ssh.container.engine', providers.gradleProperty('sshContainerEngine').getOrElse('docker')
    systemProperty 'ssh.executable', providers.gradleProperty('sshExecutable').getOrElse('ssh')
    systemProperty 'ssh.keygen', providers.gradleProperty('sshKeygen').getOrElse('ssh-keygen')
    systemProperty 'ssh.container.host', providers.gradleProperty('sshContainerHost').getOrElse('127.0.0.1')
}
