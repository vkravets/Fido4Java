plugins {
    id 'java-library'
}

group = 'org.fidonet.jftn'
description = ''

dependencies {
    api project(':event-bus')
    implementation 'org.slf4j:slf4j-api:1.7.21'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.powermock:powermock-core:1.7.4'
    testImplementation 'org.powermock:powermock-module-junit4:1.7.4'
    testImplementation 'org.powermock:powermock-api-mockito2:1.7.4'
    testImplementation 'org.mockito:mockito-core:2.8+'
}
