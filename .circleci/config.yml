version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0-node
    retention:
      caches: 15d
    environment:
      LANG: C.UTF-8
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-thrift-0.25.0-{{ arch }}
      - restore_cache:
          keys:
            - v1-thrift-browser-0.25.0
      - restore_cache:
          keys:
            - v1-web-ui-npm-{{ checksum "web-ui/frontend/package-lock.json" }}
      - run:
          name: Check Java and Node.js runtimes
          command: |
            java -version
            node --version
            node -e 'const [major,minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) { throw new Error("Web UI build requires Node.js 22.12 or newer"); }'
      - run:
          name: Prepare Apache Thrift compiler and browser runtime
          command: bash .circleci/setup-thrift.sh
      - save_cache:
          key: v1-thrift-0.25.0-{{ arch }}
          paths:
            - ~/.cache/thrift/0.25.0/bin/thrift
      - save_cache:
          key: v1-thrift-browser-0.25.0
          paths:
            - ~/.cache/thrift/0.25.0/browser/thrift.js
      - run:
          name: Build, test and package integration runtimes
          command: |
            set -euo pipefail
            release_tag="${CIRCLE_TAG:-}"
            release_version="${release_tag#v}"
            release_version="${release_version:-1.0-SNAPSHOT}"
            bash ./gradlew build :binkp-root:binkp-netty:prepareCiIntegration \
              :binkp-root:binkp-mina2:prepareCiIntegration :jtoss:prepareCiIntegration \
              "-PreleaseVersion=$release_version" --no-daemon --console=plain
      - store_test_results:
          path: rpc/build/test-results/browserTest
      - save_cache:
          key: v1-web-ui-npm-{{ checksum "web-ui/frontend/package-lock.json" }}
          paths:
            - ~/.npm
      - store_test_results:
          path: web-ui/build/test-results/frontendTest
      - store_artifacts:
          path: web-ui/build/reports/tests/test
          destination: web-ui-java-tests
      - store_artifacts:
          path: rpc/build/test-results/browserTest
          destination: rpc-browser-tests
      - run:
          name: Seal compiled integration runtimes
          command: |
            set -euo pipefail
            git rev-parse HEAD > build/ci-integration/revision.txt
            cd build/ci-integration
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            cd ../..
            mkdir -p build/ci-release
            release_tag="${CIRCLE_TAG:-}"
            release_version="${release_tag#v}"
            release_version="${release_version:-1.0-SNAPSHOT}"
            cp "jftn-bundle/build/distributions/jftn-$release_version-no-jre.zip" build/ci-release/
            printf '%s\n' "$release_version" > build/ci-release/version.txt
            git rev-parse HEAD > build/ci-release/revision.txt
            cd build/ci-release
            sha256sum ./*.zip version.txt revision.txt > SHA256SUMS
      - persist_to_workspace:
          root: .
          paths:
            - build/ci-integration
            - build/ci-release

  package-distributions:
    docker:
      - image: cimg/openjdk:17.0-node
    retention:
      caches: 15d
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - v1-temurin-jre-{{ checksum "gradle/runtime-lock.json" }}
      - run:
          name: Package tested binaries with pinned OpenJDK runtimes and smoke test Linux ZIP
          no_output_timeout: 15m
          command: bash .circleci/package-distributions.sh
      - save_cache:
          key: v1-temurin-jre-{{ checksum "gradle/runtime-lock.json" }}
          paths:
            - jftn-bundle/build/runtime-downloads
      - store_artifacts:
          path: build/release
          destination: distributions
      - persist_to_workspace:
          root: .
          paths:
            - build/release

  github-release:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify release publisher
          command: python3 -m unittest discover -s .circleci -p 'test_*.py'
      - run:
          name: Publish complete GitHub Release for the tested tag
          command: |
            set -euo pipefail
            test "$(cat build/release/revision.txt)" = "$(git rev-parse HEAD)"
            python3 .circleci/publish-release.py build/release

  binkd-integration:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify compiled runtime from build job
          command: |
            set -euo pipefail
            test "$(cat build/ci-integration/revision.txt)" = "$(git rev-parse HEAD)"
            cd build/ci-integration
            sha256sum --check SHA256SUMS --quiet
      - run:
          name: Prepare Java 17 and Docker
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$JAVA_HOME/bin/java" -version
            "$JAVA_HOME/bin/javac" -version
            docker version
            docker info
      - restore_cache:
          keys:
            - v2-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "gradle/binkd-integration.gradle" }}
      - run:
          name: Test JFtn client and server against binkd
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p build/binkd-integration
            bash ./gradlew :binkp-root:binkp-netty:binkdDockerTest \
              :binkp-root:binkp-mina2:binkdDockerTest \
              -PciIntegrationSnapshot --continue --warning-mode fail --no-daemon --console=plain \
              2>&1 | tee build/binkd-integration/gradle.log
      - save_cache:
          key: v2-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "gradle/binkd-integration.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Collect Docker diagnostics
          when: always
          command: |
            mkdir -p build/binkd-integration/test-results
            for backend in netty mina2; do
              module_build="binkp/binkp-$backend/build"
              destination="build/binkd-integration/$backend"
              mkdir -p "$destination" "build/binkd-integration/test-results/$backend"
              if [ -d "$module_build/test-results/binkdDockerTest" ]; then
                find "$module_build/test-results/binkdDockerTest" -maxdepth 1 -name '*.xml' \
                  -exec cp {} "build/binkd-integration/test-results/$backend/" \;
              fi
              if [ -d "$module_build/reports/tests/binkdDockerTest" ]; then
                cp -a "$module_build/reports/tests/binkdDockerTest" "$destination/html"
              fi
              if [ -d "$module_build/reports/binkdDockerTest" ]; then
                cp -a "$module_build/reports/binkdDockerTest" "$destination/diagnostics"
              fi
            done
            docker ps -a > build/binkd-integration/docker-containers.txt 2>&1 || true
            docker info > build/binkd-integration/docker-info.txt 2>&1 || true
      - store_test_results:
          path: build/binkd-integration/test-results
      - store_artifacts:
          path: build/binkd-integration
          destination: binkd-integration

  hpt-integration:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify compiled runtime from build job
          command: |
            set -euo pipefail
            test "$(cat build/ci-integration/revision.txt)" = "$(git rev-parse HEAD)"
            cd build/ci-integration
            sha256sum --check SHA256SUMS --quiet
      - run:
          name: Prepare Java 17 and Docker
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            docker info
      - restore_cache:
          keys:
            - v1-hpt-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/hpt-integration.gradle" }}
      - run:
          name: Build pinned HPT and test JAM interoperability
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p build/hpt-integration
            docker build -t jftn-hpt-interop:ci jtoss/src/integrationTest/resources/hpt \
              2>&1 | tee build/hpt-integration/image-build.log
            bash ./gradlew :jtoss:hptInteropTest -Dhpt.image=jftn-hpt-interop:ci \
              -PciIntegrationSnapshot --warning-mode fail --no-daemon --console=plain \
              2>&1 | tee build/hpt-integration/gradle.log
      - save_cache:
          key: v1-hpt-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/hpt-integration.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: jtoss/build/test-results/hptInteropTest
      - store_artifacts:
          path: jtoss/build/reports/hptInteropTest
          destination: hpt-diagnostics
      - store_artifacts:
          path: jtoss/build/reports/tests/hptInteropTest
          destination: hpt-test-report
      - store_artifacts:
          path: build/hpt-integration
          destination: hpt-build

workflows:
  build-and-test:
    jobs:
      - build:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/
      - binkd-integration:
          requires:
            - build
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/
      - hpt-integration:
          requires:
            - build
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/
      - package-distributions:
          requires:
            - build
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/
      - github-release:
          requires:
            - package-distributions
            - binkd-integration
            - hpt-integration
          context: github-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/
