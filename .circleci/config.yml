version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0
    environment:
      LANG: C.UTF-8
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-thrift-0.14.2-{{ arch }}-{{ checksum ".circleci/config.yml" }}
      - run:
          name: Install Apache Thrift compiler
          command: |
            thrift_cached_bin="$HOME/.cache/thrift/0.14.2/bin/thrift"
            if [ -x "$thrift_cached_bin" ] && [ "$("$thrift_cached_bin" -version)" = "Thrift version 0.14.2" ]; then
              echo "Using cached Thrift compiler"
            else
              sudo apt-get update
              sudo apt-get install -y build-essential bison flex libtool pkg-config libboost-dev
              thrift_build_dir=$(mktemp -d)
              (
                cd "$thrift_build_dir"
                curl -fsSLo thrift.tar.gz https://archive.apache.org/dist/thrift/0.14.2/thrift-0.14.2.tar.gz
                tar -xzf thrift.tar.gz
                cd thrift-0.14.2
                ./configure --disable-libs --disable-tests --disable-tutorial
                make -C compiler/cpp -j2
                test "$(compiler/cpp/thrift -version)" = "Thrift version 0.14.2"
                mkdir -p "$(dirname "$thrift_cached_bin")"
                install compiler/cpp/thrift "$thrift_cached_bin"
              )
            fi
            sudo install "$thrift_cached_bin" /usr/local/bin/thrift
            thrift -version
      - save_cache:
          key: v1-thrift-0.14.2-{{ arch }}-{{ checksum ".circleci/config.yml" }}
          paths:
            - ~/.cache/thrift/0.14.2/bin/thrift
      - run:
          name: Build & Tests
          command: |
            bash ./gradlew build --no-daemon --console=plain

  binkd-integration:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - checkout
      - run:
          name: Prepare Java 17 and Docker
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$JAVA_HOME/bin/java" -version
            "$JAVA_HOME/bin/javac" -version
            docker version
            docker info
      - restore_cache:
          keys:
            - v1-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "binkp/binkp-netty/build.gradle" }}
      - run:
          name: Test JFtn client and server against binkd
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p binkp/binkp-netty/build/reports/binkdDockerTest
            bash ./gradlew :binkp-root:binkp-netty:binkdDockerTest --no-daemon --console=plain \
              2>&1 | tee binkp/binkp-netty/build/reports/binkdDockerTest/gradle.log
      - save_cache:
          key: v1-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "binkp/binkp-netty/build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Collect Docker diagnostics
          when: always
          command: |
            mkdir -p binkp/binkp-netty/build/reports/binkdDockerTest
            docker ps -a > binkp/binkp-netty/build/reports/binkdDockerTest/docker-containers.txt 2>&1 || true
            docker info > binkp/binkp-netty/build/reports/binkdDockerTest/docker-info.txt 2>&1 || true
      - store_test_results:
          path: binkp/binkp-netty/build/test-results/binkdDockerTest
      - store_artifacts:
          path: binkp/binkp-netty/build/reports/tests/binkdDockerTest
          destination: binkd-integration-report
      - store_artifacts:
          path: binkp/binkp-netty/build/reports/binkdDockerTest
          destination: binkd-integration-diagnostics

workflows:
  build-and-test:
    jobs:
      - build
      - binkd-integration
