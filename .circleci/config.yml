version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0
    environment:
      LANG: C.UTF-8
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-thrift-0.14.2-{{ arch }}-{{ checksum ".circleci/config.yml" }}
      - run:
          name: Install Apache Thrift compiler
          command: |
            thrift_cached_bin="$HOME/.cache/thrift/0.14.2/bin/thrift"
            if [ -x "$thrift_cached_bin" ] && [ "$("$thrift_cached_bin" -version)" = "Thrift version 0.14.2" ]; then
              echo "Using cached Thrift compiler"
            else
              sudo apt-get update
              sudo apt-get install -y build-essential bison flex libtool pkg-config libboost-dev
              thrift_build_dir=$(mktemp -d)
              (
                cd "$thrift_build_dir"
                curl -fsSLo thrift.tar.gz https://archive.apache.org/dist/thrift/0.14.2/thrift-0.14.2.tar.gz
                tar -xzf thrift.tar.gz
                cd thrift-0.14.2
                ./configure --disable-libs --disable-tests --disable-tutorial
                make -C compiler/cpp -j2
                test "$(compiler/cpp/thrift -version)" = "Thrift version 0.14.2"
                mkdir -p "$(dirname "$thrift_cached_bin")"
                install compiler/cpp/thrift "$thrift_cached_bin"
              )
            fi
            sudo install "$thrift_cached_bin" /usr/local/bin/thrift
            thrift -version
      - save_cache:
          key: v1-thrift-0.14.2-{{ arch }}-{{ checksum ".circleci/config.yml" }}
          paths:
            - ~/.cache/thrift/0.14.2/bin/thrift
      - run:
          name: Build & Tests
          command: |
            bash ./gradlew build --no-daemon --console=plain

  binkd-integration:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - checkout
      - run:
          name: Prepare Java 17 and Docker
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$JAVA_HOME/bin/java" -version
            "$JAVA_HOME/bin/javac" -version
            docker version
            docker info
      - restore_cache:
          keys:
            - v2-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "gradle/binkd-integration.gradle" }}
      - run:
          name: Test JFtn client and server against binkd
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p build/binkd-integration
            bash ./gradlew :binkp-root:binkp-netty:binkdDockerTest \
              :binkp-root:binkp-mina2:binkdDockerTest :binkp-root:binkp-mina3:binkdDockerTest \
              --continue --warning-mode fail --no-daemon --console=plain \
              2>&1 | tee build/binkd-integration/gradle.log
      - save_cache:
          key: v2-binkd-gradle-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "gradle/binkd-integration.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Collect Docker diagnostics
          when: always
          command: |
            mkdir -p build/binkd-integration/test-results
            for backend in netty mina2 mina3; do
              module_build="binkp/binkp-$backend/build"
              destination="build/binkd-integration/$backend"
              mkdir -p "$destination" "build/binkd-integration/test-results/$backend"
              if [ -d "$module_build/test-results/binkdDockerTest" ]; then
                find "$module_build/test-results/binkdDockerTest" -maxdepth 1 -name '*.xml' \
                  -exec cp {} "build/binkd-integration/test-results/$backend/" \;
              fi
              if [ -d "$module_build/reports/tests/binkdDockerTest" ]; then
                cp -a "$module_build/reports/tests/binkdDockerTest" "$destination/html"
              fi
              if [ -d "$module_build/reports/binkdDockerTest" ]; then
                cp -a "$module_build/reports/binkdDockerTest" "$destination/diagnostics"
              fi
            done
            docker ps -a > build/binkd-integration/docker-containers.txt 2>&1 || true
            docker info > build/binkd-integration/docker-info.txt 2>&1 || true
      - store_test_results:
          path: build/binkd-integration/test-results
      - store_artifacts:
          path: build/binkd-integration
          destination: binkd-integration

workflows:
  build-and-test:
    jobs:
      - build
      - binkd-integration
