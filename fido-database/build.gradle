
apply plugin: 'java-library'

description = ''
dependencies {
  api project(':fido-tools')
    api 'com.j256.ormlite:ormlite-core:4.48'
    api 'com.j256.ormlite:ormlite-jdbc:4.48'
  api project(':tools')
    api 'org.slf4j:slf4j-api:1.7.21'
    testImplementation 'com.h2database:h2:1.4.192'
    testImplementation 'junit:junit:4.12'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'
  compileOnly project(':plugin-manager')
}
