description = 'JFtn node application and standalone distributions'

tasks.named('jar') {
    manifest.attributes('Main-Class': 'org.fidonet.jftn.JFtnRunner',
            'Implementation-Version': project.version)
    // Editable scripts are shipped separately and loaded from the scripts/ classpath root.
    exclude 'mail-scripts/**'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

apply from: rootProject.file('gradle/distributions.gradle')

tasks.register('importJamArchive', JavaExec) {
    group = 'application'
    description = 'Imports a historical JAM area into SQL without scheduling delivery.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.fidonet.jftn.JamArchiveImport'
    doFirst {
        def source = providers.gradleProperty('jamSource').get()
        def area = providers.gradleProperty('jamArea').orElse('-').get()
        def aka = providers.gradleProperty('jamAka').get()
        args providers.gradleProperty('jftnConfig').orElse('jftn.conf').get(),
                providers.gradleProperty('jamDatabase').orElse('jdbc:h2:./database/jftn10').get(),
                source, area, aka, providers.gradleProperty('jamCharset').orElse('CP866').get()
    }
}

dependencies {
    implementation project(':web-ui')
    implementation project(':fido-config')
    implementation project(':fido-database')
    implementation project(':fido-tools')
    implementation project(':event-bus')
    implementation project(':script-api')
    implementation project(':plugin-manager')
    implementation project(':scheduler')
    implementation project(':jtoss')
    implementation project(':mail-api')
    runtimeOnly project(':fileecho')
    runtimeOnly project(':jam-bridge')
    runtimeOnly project(':nodelist')
    implementation project(':binkp-root:binkp-common')
    implementation project(':binkp-root:binkp-netty')
    implementation project(':rpc')
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    implementation 'com.h2database:h2:2.5.252'

}
