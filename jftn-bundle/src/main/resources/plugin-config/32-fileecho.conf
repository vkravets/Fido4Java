# Optional file echo delivery service. A change requires restart.
FileEchoEnabled=true
FileEchoSource=database
FileEchoRoot=./fileecho
# Apply authenticated HTick Replaces masks; removed active files are retained under dupes.
TicReplaces=true
# In file mode only: AutoCreateFileFrom=1:500/101|lists.*,test.*|WRITE
# File area declarations and TIC defaults are in 42-filefix.conf for existing installations.
