# Storage providers and repository adapters are internal plugin configuration.
# Omit these declarations to preserve the existing database paths.
# StorageEndpoint=name|provider|provider-specific-location
# StorageEndpoint=mail|h2|./database/jftn10
# StorageEndpoint=directory|h2|./database/nodelist/catalog
# StorageEndpoint=accounts|h2|./database/rpc-auth
# StorageEndpoint=reader|h2|./mail/tmp/ui-state
# Paths above are examples: RpcAuthPath and Tmp may select other existing defaults.
# Changing a location does not migrate data. Stop the node and back up state first.
# A new provider also needs compatible adapters for every enabled repository.
