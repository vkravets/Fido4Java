# Optional external Binkley-style outbound. Drain handoffs before changing paths or modes.
BsoEnabled=false
# BsoOutbound defaults to the station Outbound path; BsoZone defaults to the first local AKA zone.
# BsoOutbound=./outbound
# BsoZone=1
# Local FILE attaches must be beneath this directory (defaults to Outbound/attachments).
# FileAttachRoot=./outbound/attachments
# Keep received transit payloads unless FLAGS KFS/TFS explicitly requests an action.
BsoKeepTransitFiles=true
# RouteFile=1:500/*,1:500/101
