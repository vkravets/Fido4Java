# The directory script loads after FileFix; without feeds it remains inactive.
# Catalog settings belong in 30-nodelist.conf; feeds are independent of scheduled imports.
# DirectoryFeed=nodes|NODELIST|lists|NODELIST.*|NODEDIFF.*|./lists/nodes.lst|1:500/101|1|500
# DirectoryFeed=points|BOSS|lists|POINTS.*|POINTDIF.*|./lists/points.lst|1:500/101
# Optional catch-up scan of accepted fileecho folders (including legacy receipt-prefixed files).
# DirectoryFeedFolder=nodes|./fileecho/nodelist
# DirectoryFeedFolder=points|./fileecho/pnt46
# Configure the matching DirectoryFeed above; folders are not scanned recursively.

# Optional direct import of completed files from an explicitly trusted binkp peer.
# This does not require FileArea/TicPeer rules or a TIC password.
# Existing inbound files are scanned too. Sources/paths must not overlap DirectoryFeed.
DirectoryInboundEnabled=false
# DirectoryInboundRequireDate=true
# DirectoryInboundRetrySeconds=300
# DirectoryInboundFeed=nodes|NODELIST|NODELIST.*|NODEDIFF.*|./lists/nodes.lst|1:500/101|0|0|US-ASCII|true
# DirectoryInboundFeed=region|NODELIST|REGION46.*||./lists/region46.lst|1:500/101|2|0|US-ASCII|true
# DirectoryInboundFeed=points|BOSS|PNT46REG.*||./lists/points46.lst|1:500/101|0|0|US-ASCII|true
