# Delivery policy only. Source formats/paths/CRC are defined once in 30-nodelist.conf.
# The script uses the node-owned service, without opening another catalog.
# DirectoryFeed=nodes|nodelist|NODELIST.*|NODEDIFF.*|1:500/101
# DirectoryFeed=points|pnt46|PNT46REG.*||1:500/101

# Catch-up scan of accepted fileecho folders, without recursing into dupes.
# DirectoryFeedFolder=nodes|./fileecho/nodelist
# DirectoryFeedFolder=points|./fileecho/pnt46

# Alternative: completed transport deliveries from a trusted peer, without TIC.
# Each source ID must have one delivery policy; do not also configure a TIC feed for it.
DirectoryInboundEnabled=false
# DirectoryInboundRequireDate=true
# DirectoryInboundRetrySeconds=300
# DirectoryInboundFeed=nodes|NODELIST.*|NODEDIFF.*|1:500/101
# DirectoryInboundFeed=points|PNT46REG.*||1:500/101
