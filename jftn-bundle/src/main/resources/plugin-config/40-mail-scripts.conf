# Keep every MailScript entry in this one file, in registration order.
RobotAccessSource=files
# files works without UI/RPC; database uses live mail_robot_access rules, without file fallback.
# See docs/robot-access.md for offline validation and explicit import.
# Later configuration files replace the entire list for a repeated key.
# Paths are relative to the node working directory, set by the distribution launchers.
# Handlers load immediately; peer/area/feed rules belong in 41..43 files.
MailScript=./scripts/mail-scripts/areafix.groovy
MailScript=./scripts/mail-scripts/filefix.groovy
MailScript=./scripts/mail-scripts/directory-import.groovy
