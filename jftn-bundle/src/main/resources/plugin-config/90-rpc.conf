# File-only RPC listener/authentication internals. Restart after changes.
# Setup enables RPC and creates an initial account; passwords are stored in the account DB.
# RpcEnabled=true
# RpcBind=127.0.0.1
# RpcPort=9090
# RpcSessionSeconds=3600
# RpcRegistrationEnabled=true
# RpcAuthPath=./database/rpc-auth
# RpcPasskeysEnabled=true
# RpcWebAuthnRpId=localhost
# RpcWebAuthnOrigin=http://localhost:9091
# RpcLogFile=./logs/jftn.log
# RpcHttpEnabled=true
# RpcHttpBind=127.0.0.1
# RpcHttpPort=9091
# RpcHttpOrigin belongs to the UI-managed jftn.conf and is rejected in conf.d.
