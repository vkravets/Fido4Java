# Single owner and source registry for automatic node/point directory imports.
# False disables local refresh and scripted delivery imports; the catalog is retained.
NodeDirectoryEnabled=true
# NodeDirectoryPath=./database/nodelist/catalog

# Define sources once: id|format|retained-base-file[|zone|net|charset|requireChecksum].
# DirectorySource=nodes|NODELIST|./lists/nodes.lst|0|0|CP866|true
# DirectorySource=points|BOSS|./lists/points.lst|0|0|CP866|true

# Periodic imports of explicit local files. Never assign a delivery feed to these IDs.
DirectoryRefreshEnabled=false
# DirectoryRefreshSeconds=300
# DirectoryLocalSource=nodes

# Delivery selection lives in 43-directory-feed.conf and references these IDs.
# NodeListUrl/NodeListCharset in jftn.conf are explicit UI lookup/download settings.
