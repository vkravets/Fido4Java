plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.4'
}

apply from: "$rootDir/gradle/formatting.gradle"

allprojects {
    group = 'org.fidonet'
    version = '1.0-SNAPSHOT'
}

apply from: "$rootDir/gradle/coverage.gradle"

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'

    dependencies {
        testImplementation enforcedPlatform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            includeEngines 'junit-jupiter'
        }
    }

    // VS Code's Java extension imports the Eclipse/Buildship model.
    // Keep IDE output separate from Gradle output and inside the build directory.
    eclipse {
        classpath {
            defaultOutputDir = layout.buildDirectory.dir('ide/classes/default').get().asFile
            baseSourceOutputDir.set(layout.buildDirectory.dir('ide/classes'))
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 11
    }

    repositories {
        mavenLocal()
        mavenCentral()

        maven { url = 'https://maven.vaadin.com/vaadin-addons' }
        maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
        maven { url = "https://bits.netbeans.org/nexus/content/groups/netbeans" }
    }

// give test dependencies access to compileOnly dependencies to emulate providedCompile
    configurations {
        testImplementation.extendsFrom compileOnly
    }

    test {
        testLogging {
            events 'passed', 'skipped', 'failed', 'standard_out', 'standard_error'
            exceptionFormat = 'full'
        }
    }
}
