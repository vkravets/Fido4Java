allprojects {
    group = 'org.fidonet'
    version = '1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'

    // VS Code's Java extension imports the Eclipse/Buildship model.
    // Keep IDE output separate from Gradle output and inside the build directory.
    eclipse {
        classpath {
            defaultOutputDir = layout.buildDirectory.dir('ide/classes/default').get().asFile
            baseSourceOutputDir.set(layout.buildDirectory.dir('ide/classes'))
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 11
    }

    repositories {
        mavenLocal()
        mavenCentral()

        maven { url 'https://maven.vaadin.com/vaadin-addons' }
        maven { url 'https://maven.vaadin.com/vaadin-prereleases' }
        maven { url "https://bits.netbeans.org/nexus/content/groups/netbeans" }
    }

// give test dependencies access to compileOnly dependencies to emulate providedCompile
    configurations {
        testImplementation.extendsFrom compileOnly
    }

    test {
        testLogging {
            events 'passed', 'skipped', 'failed', 'standard_out', 'standard_error'
            exceptionFormat 'full'
        }
    }
}
