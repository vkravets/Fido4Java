// Each backend compiles shared scenarios with its own isolated runtime classpath.
sourceSets {
    integrationTest {
        java.srcDir "$rootDir/binkp/src/integrationTestShared/java"
        resources.srcDir "$rootDir/binkp/src/integrationTestShared/resources"
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
}

// Explicit task only; ordinary builds do not start containers.
tasks.register('binkdDockerTest', Test) {
    description = "Exchanges files with binkd using ${project.name} client and server roles."
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
    systemProperty 'binkd.artifactsDir', layout.buildDirectory.dir('reports/binkdDockerTest').get().asFile.absolutePath
}

apply from: "$rootDir/gradle/ci-integration.gradle"
configureCiIntegration('binkdDockerTest')
