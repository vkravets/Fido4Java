sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
    integrationTestRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
}

def workerJar = tasks.register('hptInteropWorkerJar', Jar) {
    archiveClassifier = 'hpt-worker'
    from sourceSets.integrationTest.output
}

def workerFiles = tasks.register('hptInteropWorkerFiles', Sync) {
    into layout.buildDirectory.dir('hpt-worker')
    from tasks.named('jar')
    from workerJar
    from configurations.integrationTestRuntimeClasspath
}

tasks.register('hptInteropTest', Test) {
    description = 'Checks JAM and SQL interoperability with real HPT processes.'
    group = 'verification'
    if (!providers.gradleProperty('ciIntegrationSnapshot').isPresent()) {
        dependsOn workerFiles
    }
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    include '**/HptInteropTest.class'
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'hpt.workerFiles', layout.buildDirectory.dir('hpt-worker').get().asFile.absolutePath
    systemProperty 'hpt.artifactsDir', layout.buildDirectory.dir('reports/hptInteropTest').get().asFile.absolutePath
    if (providers.systemProperty('hpt.image').isPresent()) {
        systemProperty 'hpt.image', providers.systemProperty('hpt.image').get()
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

apply from: "$rootDir/gradle/ci-integration.gradle"
configureCiIntegration('hptInteropTest', workerFiles)

['bso', 'htick'].each { suite ->
    tasks.register("${suite}InteropTest", Test) {
        description = "Checks real ${suite} mail interoperability in isolated Linux containers."
        group = 'verification'
        def original = tasks.named('hptInteropTest', Test).get()
        if (!providers.gradleProperty('ciIntegrationSnapshot').isPresent()) {
            dependsOn workerFiles
        }
        testClassesDirs = original.testClassesDirs
        classpath = original.classpath
        systemProperties original.systemProperties
        systemProperty 'mailInterop.engine', providers.systemProperty('mailInterop.engine').getOrElse('docker')
        systemProperty 'mailInterop.image', providers.systemProperty('mailInterop.image').getOrElse('jftn-hpt-interop:local')
        systemProperty 'mailInterop.artifactsDir', layout.buildDirectory.dir("reports/${suite}InteropTest").get().asFile.absolutePath
        include "**/${suite.capitalize()}InteropTest.class"
        useJUnitPlatform()
        maxParallelForks = 1
        outputs.upToDateWhen { false }
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }
}
