import groovy.json.JsonSlurper
import org.fidonet.gradle.distribution.DownloadRuntime

def applicationJar = tasks.named('jar')
def runtimeLibraries = configurations.runtimeClasspath
def pluginJars = files([':fido-database', ':scheduler', ':nodelist', ':jam-bridge', ':binkp-root:binkp-netty']
        .collect { project(it).tasks.named('jar') })
def groovyJars = runtimeLibraries.filter { it.name.startsWith('groovy-') }
def sharedLibraries = runtimeLibraries.minus(pluginJars).minus(groovyJars)
def distributionRoot = "jftn-${project.version}"
def distributionInput = providers.gradleProperty('distributionInput')
def layoutDirectory = layout.buildDirectory.dir('distribution-layout')
def prepareLayout = tasks.register('prepareDistributionLayout') {
    outputs.dir(layoutDirectory)
    doLast {
        ['mail/inbound', 'mail/outbound', 'mail/tmp', 'mail/echo', 'database', 'logs', 'lists', 'fileecho'].each {
            new File(layoutDirectory.get().asFile, it).mkdirs()
        }
    }
}

def baseFiles = copySpec {
    if (distributionInput.isPresent()) {
        from zipTree(rootProject.file(distributionInput.get()))
    } else {
        into(distributionRoot) {
            into('lib') {
                from applicationJar
                from sharedLibraries
            }
            into('plugins') { from pluginJars }
            into('lib/groovy') { from groovyJars }
            into('scripts/mail-scripts') { from 'src/main/resources/mail-scripts' }
            from('src/distribution')
            from('src/main/static-content/jftn.conf-dist') { rename { 'jftn.conf.example' } }
            from(rootProject.file('LICENSE'))
            from(rootProject.file('docs')) { into 'docs' }
            from(layoutDirectory)
        }
    }
    // Windows zipTree staging cannot retain Unix mode bits from a sealed input ZIP.
    filesMatching('**/jftn.sh') { permissions { unix('rwxr-xr-x') } }
}

def zipWithoutJre = tasks.register('distZip', Zip) {
    group = 'distribution'
    description = 'Builds the portable ZIP; requires an installed Java 17+ runtime.'
    if (!distributionInput.isPresent()) { dependsOn applicationJar, prepareLayout }
    archiveFileName = "${distributionRoot}-no-jre.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    with baseFiles
}

def runtimeLockFile = rootProject.file('gradle/runtime-lock.json')
def runtimeLock = new JsonSlurper().parse(runtimeLockFile)
def bundledZips = ['linux-x64', 'windows-x64'].collect { platform ->
    def entry = runtimeLock[platform]
    def suffix = platform == 'linux-x64' ? 'LinuxX64' : 'WindowsX64'
    def download = tasks.register("downloadJre${suffix}", DownloadRuntime) {
        url = entry.url
        sha256 = entry.sha256
        archive = layout.buildDirectory.file("runtime-downloads/${entry.archive}")
    }
    def unpacked = layout.buildDirectory.dir("runtime-images/${platform}")
    def unpack = tasks.register("unpackJre${suffix}", Sync) {
        dependsOn download
        from(providers.provider {
            def archiveFile = download.get().archive.get().asFile
            platform == 'linux-x64' ? tarTree(resources.gzip(archiveFile)) : zipTree(archiveFile)
        }) {
            eachFile { relativePath = new RelativePath(!directory, relativePath.segments.drop(1) as String[]) }
            includeEmptyDirs = false
        }
        into unpacked
    }
    tasks.register("distZip${suffix}", Zip) {
        group = 'distribution'
        description = "Builds the ${platform} ZIP with the locked Temurin OpenJDK JRE."
        dependsOn unpack
        if (!distributionInput.isPresent()) { dependsOn applicationJar, prepareLayout }
        archiveFileName = "${distributionRoot}-${platform}.zip"
        destinationDirectory = layout.buildDirectory.dir('distributions')
        with baseFiles
        into("${distributionRoot}/jre") {
            from unpacked
            filesMatching(['**/bin/**', '**/lib/jspawnhelper', '**/lib/jexec']) {
                permissions { unix('rwxr-xr-x') }
            }
        }
        into(distributionRoot) { from runtimeLockFile }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Zip).matching { it.name.startsWith('distZip') }.configureEach {
    // Copy actions (including Unix mode fixes) must invalidate an already staged archive.
    inputs.file(rootProject.file('gradle/distributions.gradle'))
}

tasks.register('releaseDistributions') {
    group = 'distribution'
    description = 'Builds all ZIP distributions with separate libraries, plugins and scripts.'
    dependsOn zipWithoutJre, bundledZips
}

tasks.named('assemble') { dependsOn zipWithoutJre }

tasks.named('test', Test) {
    dependsOn zipWithoutJre
    inputs.file(zipWithoutJre.flatMap { it.archiveFile })
    systemProperty 'distribution.zip', zipWithoutJre.get().archiveFile.get().asFile.absolutePath
    systemProperty 'distribution.probe', sourceSets.test.output.classesDirs.asPath
}
