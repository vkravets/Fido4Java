apply plugin: 'java-library'

description = 'Embedded browser UI and first-run node configuration'

dependencies {
    api project(':rpc')
    implementation project(':fido-config')
    implementation project(':fido-fts')
    implementation project(':nodelist')
    runtimeOnly 'com.h2database:h2:2.5.252'
}

def nodeExecutable = providers.gradleProperty('nodeExecutable').map {
    File candidate = rootProject.file(it)
    candidate.isFile() ? candidate.absolutePath : it
}
        .orElse(providers.provider {
            String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
            String platform = os.contains('windows') ? 'win' : os.contains('mac') ? 'darwin' : 'linux'
            String architecture = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'x64'
            String binary = platform == 'win' ? 'node.exe' : 'bin/node'
            File downloaded = rootProject.file("build/node-v24.22.0-${platform}-${architecture}/${binary}")
            downloaded.isFile() ? downloaded.absolutePath : 'node'
        })
def npmExecutable = providers.gradleProperty('npmExecutable').orElse(
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'npm.cmd' : 'npm')
def thriftRuntime = providers.gradleProperty('thriftBrowserRuntime')
        .orElse(providers.environmentVariable('THRIFT_BROWSER_RUNTIME'))
def generated = layout.buildDirectory.dir('frontend-generated')
def rpcBindings = project(':rpc').layout.buildDirectory.file('generated/browser-module/bindings.mjs')
def rpcAdapter = project(':rpc').file('src/main/browser/client.mjs')
def rpcDeclarations = project(':rpc').layout.buildDirectory.file('generated/browser-module/bindings.d.mts')

def npmCi = tasks.register('npmCi', Exec) {
    group = 'build'
    workingDir file('frontend')
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
    doFirst {
        def node = file(nodeExecutable.get())
        def npmCli = new File(node.parentFile, 'node_modules/npm/bin/npm-cli.js')
        if (node.isFile() && npmCli.isFile()) {
            commandLine node.absolutePath, npmCli.absolutePath, 'ci', '--no-audit', '--no-fund'
            environment 'PATH', node.parentFile.absolutePath + File.pathSeparator + System.getenv('PATH')
        } else {
            commandLine npmExecutable.get(),
                    'ci', '--no-audit', '--no-fund'
        }
        if (providers.gradleProperty('npmCache').isPresent()) {
            environment 'npm_config_cache', rootProject.file(providers.gradleProperty('npmCache').get()).absolutePath
        }
    }
}

def prepareFrontendRpc = tasks.register('prepareFrontendRpc') {
    dependsOn ':rpc:bundleThriftBrowser', npmCi
    inputs.file(rpcBindings)
    inputs.file(rpcAdapter)
    inputs.file(rpcDeclarations)
    inputs.files(thriftRuntime.map { rootProject.file(it) }).optional()
    outputs.dir(generated)
    doLast {
        if (!thriftRuntime.isPresent() || !rootProject.file(thriftRuntime.get()).isFile()) {
            throw new GradleException('Set THRIFT_BROWSER_RUNTIME to the matching Apache Thrift lib/js/src/thrift.js.')
        }
        def directory = generated.get().asFile
        directory.mkdirs()
        copy {
            from rpcBindings
            from rpcAdapter
            from rpcDeclarations
            into directory
        }
        new File(directory, 'runtime.mjs').setText('''// Official Thrift browser runtime plus exact i64 JSON support.
import Int64 from '../../frontend/node_modules/node-int64/Int64.js';
import parse from '../../frontend/node_modules/thrift/lib/nodejs/lib/thrift/json_parse.js';
import Int64Util from '../../frontend/node_modules/thrift/lib/nodejs/lib/thrift/int64_util.js';
import { Buffer } from '../../frontend/node_modules/buffer/index.js';
globalThis.Buffer ??= Buffer;
const JSONInt64 = { parse };
''' + rootProject.file(thriftRuntime.get()).getText('UTF-8') +
                '\nexport { Thrift, Int64 };\n', 'UTF-8')
        new File(directory, 'runtime.d.mts').setText('export const Thrift: unknown;\nexport const Int64: unknown;\n', 'UTF-8')
        new File(directory, 'client.d.mts').setText('export declare function createRpcClient<T>(runtime: unknown, client: { prototype: T }, endpoint: string, timeoutMillis?: number): T;\n', 'UTF-8')
    }
}

def buildFrontend = tasks.register('buildFrontend', Exec) {
    group = 'build'
    dependsOn prepareFrontendRpc
    dependsOn 'typecheckFrontend'
    workingDir file('frontend')
    inputs.files(fileTree('frontend') { exclude 'node_modules/**' })
    inputs.dir(generated)
    outputs.dir(layout.buildDirectory.dir('frontend-dist'))
    commandLine nodeExecutable.get(), file('frontend/node_modules/vite/bin/vite.js'), 'build'
}

tasks.named('processResources') {
    dependsOn buildFrontend
    from(layout.buildDirectory.dir('frontend-dist')) { into 'web-ui' }
}

def frontendTest = tasks.register('frontendTest', Exec) {
    group = 'verification'
    dependsOn prepareFrontendRpc
    workingDir file('frontend')
    inputs.files(fileTree('frontend/src'), fileTree('frontend/test'))
    inputs.dir(generated)
    outputs.upToDateWhen { false }
    def report = layout.buildDirectory.file('test-results/frontendTest/results.xml')
    outputs.file(report)
    doFirst {
        report.get().asFile.parentFile.mkdirs()
        commandLine nodeExecutable.get(), '--test', '--test-reporter=spec', '--test-reporter=junit',
                '--test-reporter-destination=stdout',
                '--test-reporter-destination=' + report.get().asFile.absolutePath,
                '--experimental-strip-types',
                *fileTree('frontend/test').matching { include '*.test.ts' }.files.sort().collect { it.absolutePath }
    }
}

// Local backend checks do not implicitly run browser application tests.
// CI keeps the full check graph; developers can opt in with -PuiChecks=true.
def uiChecks = providers.gradleProperty('uiChecks')
        .orElse(providers.environmentVariable('CI'))
        .map { it.equalsIgnoreCase('true') }
        .orElse(false)
tasks.named('check') {
    if (uiChecks.get()) { dependsOn frontendTest }
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'browser' }
    systemProperty 'ui.node', nodeExecutable.get()
    systemProperty 'ui.workflow', file('frontend/test/rpc-workflow.ts').absolutePath
    inputs.file('frontend/test/rpc-workflow.ts')
}

tasks.register('typecheckFrontend', Exec) {
    group = 'verification'
    dependsOn prepareFrontendRpc
    workingDir file('frontend')
    commandLine nodeExecutable.get(), file('frontend/node_modules/vue-tsc/bin/vue-tsc.js'), '--noEmit'
}

// Interactive developer tasks stay outside build/check and keep serving until Ctrl+C.
def storybookPort = providers.gradleProperty('storybookPort').orElse('6006')

def configureStorybookProcess = { Exec task ->
    task.group = 'application'
    task.workingDir file('frontend')
    task.doFirst {
        int port = Integer.parseInt(storybookPort.get())
        if (port < 1 || port > 65535) {
            throw new GradleException('storybookPort must be in 1..65535')
        }
        File node = file(nodeExecutable.get())
        if (node.isFile()) {
            task.environment 'PATH', node.parentFile.absolutePath + File.pathSeparator + System.getenv('PATH')
        }
        logger.lifecycle("Storybook: http://127.0.0.1:${port}/ (Ctrl+C to stop)")
    }
}

tasks.register('storybook', Exec) {
    description = 'Starts isolated Storybook examples without requiring the Thrift compiler.'
    // Stories use RPC contracts only in import type declarations, erased by Vite.
    // Full contract checking remains in typecheckStorybook/buildStorybook.
    dependsOn npmCi
    configureStorybookProcess(delegate)
    commandLine nodeExecutable.get(), file('frontend/node_modules/storybook/dist/bin/dispatcher.js'),
            'dev', '--host', '127.0.0.1', '--port', storybookPort.get(), '--ci',
            '--no-open', '--disable-telemetry'
}

tasks.register('previewStorybook', Exec) {
    description = 'Serves a compiled Storybook catalogue, optionally from an extracted CI artifact.'
    dependsOn npmCi
    def directory = providers.gradleProperty('storybookDirectory')
            .map { rootProject.file(it).absolutePath }
            .orElse(layout.buildDirectory.dir('storybook').map { it.asFile.absolutePath })
    if (!providers.gradleProperty('storybookDirectory').isPresent()) {
        dependsOn 'buildStorybook'
    }
    configureStorybookProcess(delegate)
    doFirst {
        if (!new File(directory.get(), 'iframe.html').isFile()) {
            throw new GradleException('storybookDirectory must contain the extracted catalogue with iframe.html')
        }
    }
    commandLine nodeExecutable.get(), file('frontend/node_modules/vite/bin/vite.js'),
            'preview', '--host', '127.0.0.1', '--port', storybookPort.get(), '--strictPort',
            '--outDir', directory.get()
}

tasks.register('buildStorybook', Exec) {
    group = 'build'
    description = 'Builds isolated Vue component examples with both themes and languages.'
    dependsOn 'typecheckStorybook'
    workingDir file('frontend')
    inputs.files(fileTree('frontend/src'), fileTree('frontend/stories'), fileTree('frontend/.storybook'))
    inputs.file('frontend/vite.config.ts')
    inputs.files('frontend/package-lock.json', 'frontend/tsconfig.json', 'frontend/tsconfig.storybook.json')
    inputs.dir(generated)
    outputs.dir(layout.buildDirectory.dir('storybook'))
    commandLine nodeExecutable.get(), file('frontend/node_modules/storybook/dist/bin/dispatcher.js'),
            'build', '--output-dir', layout.buildDirectory.dir('storybook').get().asFile.absolutePath,
            '--disable-telemetry'
}

tasks.register('typecheckStorybook', Exec) {
    group = 'verification'
    dependsOn prepareFrontendRpc
    workingDir file('frontend')
    commandLine nodeExecutable.get(), file('frontend/node_modules/vue-tsc/bin/vue-tsc.js'),
            '--noEmit', '-p', 'tsconfig.storybook.json'
}

def browserSnapshot = rootProject.layout.buildDirectory.dir('ci-integration/web-ui-browser')
def useBrowserSnapshot = providers.gradleProperty('ciIntegrationSnapshot').isPresent()

tasks.register('playwrightComponentsTest', Exec) {
    group = 'verification'
    description = 'Runs Chromium tests against the compiled Storybook catalogue.'
    dependsOn npmCi
    if (!useBrowserSnapshot) {
        dependsOn 'buildStorybook'
    }
    workingDir file('frontend')
    commandLine nodeExecutable.get(), file('frontend/node_modules/@playwright/test/cli.js'),
            'test', '--config', 'playwright.config.ts'
}

tasks.register('playwrightVisualTest', Exec) {
    group = 'verification'
    description = 'Compares committed screenshots in the pinned Linux Playwright container.'
    dependsOn npmCi
    if (!useBrowserSnapshot) {
        dependsOn 'buildStorybook'
    }
    workingDir file('frontend')
    commandLine nodeExecutable.get(), '--experimental-strip-types', file('frontend/test/browser/run-visual.ts')
}

tasks.register('playwrightTest', Test) {
    group = 'verification'
    description = 'Runs Chromium against real HTTP RPC handlers and compiled Vue assets.'
    dependsOn npmCi
    useJUnitPlatform { includeTags 'browser' }
    include '**/BrowserPlaywrightTest.class'
    if (useBrowserSnapshot) {
        testClassesDirs = files(browserSnapshot.map { it.dir('test-classes') })
        classpath = files(providers.provider {
            File directory = browserSnapshot.get().asFile
            File manifest = new File(directory, 'classpath.txt')
            if (!manifest.isFile()) {
                throw new GradleException('Missing browser test snapshot. Run :web-ui:prepareBrowserTests in the build job.')
            }
            manifest.readLines('UTF-8').collect { new File(directory, it) }
        })
    } else {
        dependsOn tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
    }
    systemProperty 'ui.node', nodeExecutable.get()
    systemProperty 'ui.frontend', file('frontend').absolutePath
    systemProperty 'ui.playwright.cli', file('frontend/node_modules/@playwright/test/cli.js').absolutePath
    systemProperty 'ui.browserReports', layout.buildDirectory.dir('reports/playwright').get().asFile.absolutePath
    inputs.files(fileTree('frontend/test/browser'), file('frontend/playwright.app.config.ts'))
    outputs.upToDateWhen { false }
}

tasks.register('prepareBrowserTests') {
    group = 'build'
    description = 'Seals browser test classes, real HTTP handlers and compiled Vue assets for CI.'
    dependsOn tasks.named('testClasses'), sourceSets.test.runtimeClasspath
    outputs.dir browserSnapshot
    outputs.upToDateWhen { false }
    doLast {
        File destination = browserSnapshot.get().asFile
        delete destination
        copy {
            from sourceSets.test.output.classesDirs
            into new File(destination, 'test-classes')
        }
        List<String> entries = []
        sourceSets.test.runtimeClasspath.files.findAll { it.exists() }.eachWithIndex { entry, index ->
            String relative = entry.isDirectory() ? "runtime/${index}" : "runtime/${index}/${entry.name}"
            copy {
                from entry
                into new File(destination, "runtime/${index}")
            }
            entries.add(relative)
        }
        new File(destination, 'classpath.txt').setText(entries.join('\n') + '\n', 'UTF-8')
    }
}
