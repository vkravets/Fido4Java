name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/frontend/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/thrift/0.25.0
          key: thrift-0.25.0-${{ runner.os }}-${{ runner.arch }}
      - name: Prepare Thrift compiler and browser runtime
        run: bash ci/setup-thrift.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test CI and development tooling
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Build, test and seal compiled artifacts
        run: bash ci/build.sh
      - name: Add component catalogue viewing instructions
        run: cp ci/storybook-artifact-README.txt web-ui/build/storybook/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-release
          path: build/compiled-release.tar
          if-no-files-found: error
          retention-days: 15
      - name: Save portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: portable-distribution
          path: jftn-bundle/build/distributions/*-no-jre.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 15
      - name: Save build test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 15
      - name: Save component catalogue
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: web-ui/build/storybook/
          if-no-files-found: error
          retention-days: 15
      - name: Save committed visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines
          path: web-ui/frontend/test/browser/snapshots/
          if-no-files-found: error
          retention-days: 15

  package:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, integration, vrt, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: compiled-release
          path: build
      - run: tar -xf build/compiled-release.tar -C build
      - uses: actions/cache@v6
        with:
          path: jftn-bundle/build/runtime-downloads
          key: temurin-jre-${{ hashFiles('gradle/runtime-lock.json') }}
      - name: Package tested binaries and smoke test Linux ZIP
        run: bash ci/package-distributions.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: build/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 15

  integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [binkd, hpt]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: compiled-release
          path: build
      - run: tar -xf build/compiled-release.tar -C build
      - name: Test interoperability using compiled snapshot
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/test-integration.sh "$SUITE"
      - name: Save integration reports and protocol logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.suite }}-reports
          path: |
            **/build/test-results/**
            **/build/reports/**
          retention-days: 15

  ui:
    needs: [build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: compiled-release
          path: build
      - run: tar -xf build/compiled-release.tar -C build
      - uses: actions/download-artifact@v8
        with:
          name: storybook
          path: web-ui/build/storybook
      - name: Install browser test tools
        working-directory: web-ui/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test compiled components and real HTTP UI
        run: |
          test "$(cat build/ci-integration/revision.txt)" = "$(git rev-parse HEAD)"
          (cd build/ci-integration && sha256sum --check SHA256SUMS --quiet)
          bash ./gradlew :web-ui:playwrightComponentsTest :web-ui:playwrightTest \
            -PciIntegrationSnapshot --warning-mode fail --no-daemon --console=plain
      - name: Save browser reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-reports
          path: |
            web-ui/build/reports/playwright/**
            web-ui/build/reports/tests/playwrightTest/**
            web-ui/build/test-results/playwright/**
            web-ui/build/test-results/playwrightTest/**
          retention-days: 15

  vrt:
    needs: [build, integration, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: storybook
          path: web-ui/build/storybook
      - name: Compare visual baselines using compiled catalogue
        working-directory: web-ui/frontend
        run: npm run test:vrt
      - name: Save visual regression reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-reports
          path: |
            web-ui/build/reports/playwright/visual/**
            web-ui/build/reports/playwright/visual-results/**
            web-ui/build/reports/playwright/visual.xml
          retention-days: 15

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: build/release
      - name: Verify publisher and compiled revision
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          test "$(cat build/release/revision.txt)" = "$(git rev-parse HEAD)"
      - name: Publish verified assets using the automatic GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish-release.py build/release
