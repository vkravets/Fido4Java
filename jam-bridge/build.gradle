apply plugin: 'java-library'

description = 'Optional JAM editor synchronization plugin'

dependencies {
    api project(':jtoss')
    implementation project(':plugin-manager')
    implementation 'org.slf4j:slf4j-api:2.0.20'

    testRuntimeOnly 'com.h2database:h2:2.5.252'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
}
