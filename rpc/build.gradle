apply plugin: 'java-library'

dependencies {
    implementation project(':fido-fts')
    api 'org.apache.thrift:libthrift:0.25.0'
    api 'org.slf4j:slf4j-api:2.0.20'
    implementation 'com.yubico:webauthn-server-core:2.10.1'
    implementation platform('com.yubico:webauthn-server-parent:2.10.1')
    implementation enforcedPlatform('com.fasterxml.jackson:jackson-bom:2.22.3')
    implementation 'com.fasterxml.jackson.core:jackson-core'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'com.h2database:h2:2.5.252'

    // Yubico publishes broad dependency ranges; keep runtime resolution on tested GA releases.
    constraints {
        implementation('org.apache.httpcomponents.client5:httpclient5') {
            version { strictly '5.6.5' }
        }
        implementation('org.apache.httpcomponents.core5:httpcore5') {
            version { strictly '5.4.4' }
        }
        implementation('org.apache.httpcomponents.core5:httpcore5-h2') {
            version { strictly '5.4.4' }
        }
        implementation('com.google.guava:guava') {
            version { strictly '33.7.2-jre' }
        }
        implementation('com.upokecenter:cbor') {
            version { strictly '4.5.6' }
        }
    }

    compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
}

// The old Thrift plugin uses IncrementalTaskInputs, removed in Gradle 8.
// Keep the native compiler configurable for Windows and other platforms.
def thriftExecutable = providers.gradleProperty('thriftExecutable').orElse('thrift')
def generatedThriftSources = layout.buildDirectory.dir('gen-src')

def compileThrift = tasks.register('compileThrift', Exec) {
    inputs.files(fileTree('src/main/thrift') { include '**/*.thrift' })
    inputs.property('thriftExecutable', thriftExecutable)
    outputs.dir(generatedThriftSources)

    doFirst {
        def outputDir = generatedThriftSources.get().asFile
        outputDir.mkdirs()
        commandLine thriftExecutable.get(), '--nowarn', '--strict', '--recurse',
                '--allow-neg-keys', '--allow-64bit-consts',
                '--gen', 'java:private-members,generated_annotations=suppress', '-out', outputDir.absolutePath,
                file('src/main/thrift/main.thrift').absolutePath
    }
}

sourceSets.main.java.srcDir(generatedThriftSources)
tasks.named('compileJava') { dependsOn compileThrift }

// Browser bindings use native Promises; no jQuery or Node.js server is required.
def generatedBrowserSources = layout.buildDirectory.dir('generated/browser')
def compileThriftBrowser = tasks.register('compileThriftBrowser', Exec) {
    group = 'build'
    description = 'Generates ES6 browser clients and TypeScript declarations from the RPC contracts.'
    inputs.files(fileTree('src/main/thrift') { include '**/*.thrift' })
    inputs.property('thriftExecutable', thriftExecutable)
    outputs.dir(generatedBrowserSources)
    doFirst {
        def outputDir = generatedBrowserSources.get().asFile
        outputDir.mkdirs()
        commandLine thriftExecutable.get(), '--nowarn', '--strict', '--recurse',
                '--gen', 'js:es6,ts', '-out', outputDir.absolutePath,
                file('src/main/thrift/main.thrift').absolutePath
    }
}

tasks.named('assemble') { dependsOn compileThriftBrowser }

// The browser generator emits classic-script globals, even with es6 enabled.
// Enclose them in a factory so Vue/Vite can import the bindings without global assignments.
def bundleThriftBrowser = tasks.register('bundleThriftBrowser') {
    dependsOn compileThriftBrowser
    inputs.dir(generatedBrowserSources)
    def bundle = layout.buildDirectory.file('generated/browser-module/bindings.mjs')
    def declarations = layout.buildDirectory.file('generated/browser-module/bindings.d.mts')
    outputs.file(bundle)
    outputs.file(declarations)
    doLast {
        def sources = fileTree(generatedBrowserSources) { include '*.js' }.files.sort { a, b ->
            (a.name.endsWith('_types.js') ? 0 : 1) <=> (b.name.endsWith('_types.js') ? 0 : 1) ?:
                    a.name <=> b.name
        }.collect {
            // The factory receives Int64 explicitly; the compiler's Node-only fallback is dead
            // code in a browser and otherwise makes Vite try to bundle CommonJS require().
            it.getText('UTF-8').replace('\r\n', '\n')
                    .replace("if (typeof Int64 === 'undefined' && typeof require === 'function') {\n  const Int64 = require('node-int64');\n}", '')
        }
        def symbols = sources.collectMany { source ->
            (source =~ /(?m)^([A-Za-z_][A-Za-z0-9_]*) = /).collect { it[1] }
        }.unique().sort()
        def output = bundle.get().asFile
        output.parentFile.mkdirs()
        output.setText('// Generated from Thrift browser bindings; do not edit.\n' +
                'export function createBindings(Thrift, Int64) {\n' +
                'let ' + symbols.join(', ') + ';\n' + sources.join('\n') +
                '\nreturn { ' + symbols.join(', ') + ' };\n}\n', 'UTF-8')
        def types = fileTree(generatedBrowserSources) { include '*.d.ts' }.files.sort().collect {
            it.getText('UTF-8').replaceAll(/(?m)^import .*;\r?\n/, '')
                    .replaceAll(/(?m)^type uuid = string;\r?\n/, '')
        }.join('\n')
        def exports = (types =~ /export declare (?:class|enum) (\w+)/).collect { it[1] }.unique().sort()
        declarations.get().asFile.setText('''// Generated from the same Thrift contracts as the runtime bindings.
import type Int64Object from 'node-int64';
type Int64 = Int64Object | number | string;
type uuid = string;
declare namespace Thrift { interface TJSONProtocol {} class TException extends Error {} }
''' + types +
                '\nexport declare function createBindings(runtime: unknown, int64: unknown): {\n' +
                exports.collect { "    ${it}: typeof ${it};" }.join('\n') + '\n};\n', 'UTF-8')
    }
}

tasks.register('browserRpcZip', Zip) {
    group = 'distribution'
    description = 'Packages generated browser bindings and the asynchronous fetch adapter.'
    dependsOn bundleThriftBrowser
    archiveClassifier = 'browser-rpc'
    from(generatedBrowserSources) { into 'generated' }
    from(layout.buildDirectory.dir('generated/browser-module'))
    from('src/main/browser')
}

tasks.named('assemble') { dependsOn tasks.named('browserRpcZip') }

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')
def thriftBrowserRuntime = providers.gradleProperty('thriftBrowserRuntime')
        .orElse(providers.environmentVariable('THRIFT_BROWSER_RUNTIME'))

def browserTest = tasks.register('browserTest', Exec) {
    group = 'verification'
    description = 'Tests generated browser clients using Node.js and the matching Thrift runtime.'
    dependsOn bundleThriftBrowser
    inputs.files(fileTree('src/main/browser') { include '**/*.mjs' })
    inputs.files(fileTree('src/test/browser') { include '**/*.mjs' })
    inputs.files(thriftBrowserRuntime.map { file(it) }).withPropertyName('thriftBrowserRuntime').optional()
    inputs.property('nodeExecutable', nodeExecutable)
    def report = layout.buildDirectory.file('test-results/browserTest/results.xml')
    outputs.file(report)
    // Five small tests also check the active Node/runtime environment on every build.
    outputs.upToDateWhen { false }
    workingDir rootProject.projectDir
    doFirst {
        if (!thriftBrowserRuntime.isPresent()) {
            throw new GradleException('RPC browser tests require THRIFT_BROWSER_RUNTIME or -PthriftBrowserRuntime pointing to Apache Thrift 0.25.0 lib/js/src/thrift.js.')
        }
        def runtime = file(thriftBrowserRuntime.get())
        if (!runtime.isFile()) {
            throw new GradleException("Thrift browser runtime was not found: ${runtime}")
        }
        def reportFile = report.get().asFile
        reportFile.parentFile.mkdirs()
        if (reportFile.exists() && !reportFile.delete()) {
            throw new GradleException("Unable to remove stale browser test report: ${reportFile}")
        }
        environment 'THRIFT_BROWSER_RUNTIME', runtime.absolutePath
        commandLine nodeExecutable.get(), '--test',
                '--test-reporter=spec', '--test-reporter=junit',
                '--test-reporter-destination=stdout',
                "--test-reporter-destination=${reportFile.absolutePath}",
                rootProject.file('rpc/src/test/browser/client.test.mjs').absolutePath
    }
}

tasks.named('check') { dependsOn browserTest }
