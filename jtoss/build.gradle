
apply plugin: 'java-library'

description = 'jtoss'
dependencies {
  api project(':event-bus')
  api project(':fido-config')
  api project(':fido-tools')
    implementation 'org.slf4j:slf4j-api:1.7.21'
    testImplementation 'junit:junit:4.12'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.6.2'
  api project(':fido-database')
  api project(':jambase')
    testRuntimeOnly 'com.h2database:h2:1.4.192'
}

apply from: "$rootDir/gradle/hpt-integration.gradle"

dependencies {
    integrationTestImplementation project(':jam-bridge')
}
