
apply plugin: 'java-library'

description = 'jtoss'
dependencies {
  api project(':event-bus')
  api project(':fido-config')
  api project(':fido-tools')
    implementation 'org.slf4j:slf4j-api:2.0.20'
    testImplementation 'junit:junit:4.13.2'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
  api project(':fido-database')
  api project(':jambase')
    testRuntimeOnly 'com.h2database:h2:2.5.252'
}

apply from: "$rootDir/gradle/hpt-integration.gradle"

dependencies {
    integrationTestImplementation project(':jam-bridge')
}
