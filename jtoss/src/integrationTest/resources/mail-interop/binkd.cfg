sysname "JFtn BSO interoperability"
sysop "Test"
location "Isolated container"
nodeinfo "TCP,BINKP"
domain fidonet @ROOT@/bso 1
address @LOCAL@@fidonet
iport 24554
conlog 5
log @ROOT@/logs/binkd.log
loglevel 5
timeout 10
inbound @ROOT@/inbound
inbound-nonsecure @ROOT@/nonsecure
temp-inbound @ROOT@/partial
prescan
send-if-pwd
node @REMOTE@@fidonet -nomd -nohc @HOST@:24554 session-secret
